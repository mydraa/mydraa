name: Metrics
on:
  # Mise à jour automatique chaque nuit à minuit UTC
  schedule:
    - cron: "0 0 * * *"
  # Permet de déclencher le rendu à tout moment depuis l'onglet Actions
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mydraa
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          output_action: commit
          committer_message: "chore(metrics): update github metrics"
