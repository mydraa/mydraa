name: Metrics
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate GitHub Metrics SVGs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 .github/scripts/generate_metrics.py \
            --user mydraa \
            --timezone Europe/Paris \
            --dark-out github-metrics.svg \
            --light-out github-metrics-light.svg

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg github-metrics-light.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(metrics): update github metrics" && git push)
