name: Metrics
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mydraa
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          output_action: none
          filename: github-metrics.svg

      - name: Sync exact profile contribution count
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          TOTAL=$(gh api graphql -f query='query { user(login: "mydraa") { contributionsCollection { contributionCalendar { totalContributions } } } }' --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          sed -i -E "s/[0-9]+ Commits/${TOTAL} Contributions/g" github-metrics.svg

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(metrics): update github metrics" && git push)
